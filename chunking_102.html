const chunks=[{"chunk_id": "DG-BG-1876-20260403-A01-P00", "article": 1, "article_title": "목적", "paragraph": "", "label": "제1조(목적)", "section": "본칙", "page_start": 1, "page_end": 1, "raw": "이 조례는 「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」과 같은 법 시행령 및 「대구광역\n시 옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 조례」에서 위임된 사항과 그 시행에 필요한 사항을 규정\n함을 목적으로 한다.", "n_chars": 127, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A02-P01", "article": 2, "article_title": "옥외광고물 등의 허가 및 신고의 제출서류 등", "paragraph": "①", "label": "제2조(옥외광고물 등의 허가 및 신고의 제출서류 등) ①", "section": "본칙", "page_start": 1, "page_end": 1, "raw": "①  「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률\n시행령」(이하 “영”이라 한다) 제7조제1항 단서에 따라 옥외광고물 또는 게시시설(이하 “광고물 등”이라 한다)을\n표시 또는 설치(이하 “표시”라 한다)하기 위하여 허가신청을 할 때 다음 각 호의 어느 하나에 해당하는 경우 영\n제7조제1항제1호 및 제2호에 따른 원색 사진, 설명서 및 설계도서를 제출하지 아니 할 수 있다. 다만, 영 제14조\n제3항 및 제4항에 따라 네온류 또는 전광류를 사용하거나 디지털광고물 등인 경우에는 제외한다.\n1.  영 제4조제1항제4호에 따른 옥상간판 중 옥상바닥으로부터의 높이가 4미터 미만인 볼링핀 모형의 간판과\n게시시설 없이 옥상구조물에 직접 도료로 표시하는 경우\n2.  영 제4조제1항제6호에 따른 애드벌룬 중 공중에 띄우거나 지면에 표시하여 높이 4미터 미만인 경우\n3.  영 제4조제1항제9호에 따른 교통수단 이용 광고물\n4.  영 제4조제1항제10호에 따른 선전탑\n5.  영 제5조제1항제4호에 따른 돌출간판 중 광고물 윗부분까지의 높이가 지면으로부터 5미터 미만인 광고물로\n서 1면의 면적이 1제곱미터 미만인 경우\n6.  영 제5조제1항제5호에 따른 지주 이용 간판\n7.  그 밖에 대구광역시 북구청장(이하 “구청장”이라 한다)이 필요하다고 인정하여 대구광역시 북구 옥외광고심\n의위원회(이하 “심의위원회”라 한다)의 심의를 거쳐 정하는 광고물 등", "n_chars": 701, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A02-P02", "article": 2, "article_title": "옥외광고물 등의 허가 및 신고의 제출서류 등", "paragraph": "②", "label": "제2조(옥외광고물 등의 허가 및 신고의 제출서류 등) ②", "section": "본칙", "page_start": 1, "page_end": 1, "raw": "②  영 제7조제1항제4호의 “심의관련 서류”란 제15조에 따라 심의위원회에서 심의대상 광고물 등의 사전심의\n에 필요하다고 인정하여 심의위원회의 의결을 거쳐 구청장이 정하는 서류를 말한다.", "n_chars": 105, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A02-P03", "article": 2, "article_title": "옥외광고물 등의 허가 및 신고의 제출서류 등", "paragraph": "③", "label": "제2조(옥외광고물 등의 허가 및 신고의 제출서류 등) ③", "section": "본칙", "page_start": 1, "page_end": 1, "raw": "③  영 제7조제1항제5호에 따른 구조안전확인서류 제출대상 광고물 등은 다음 각 호와 같다.\n1.  건물의 옥상에 별도의 게시시설을 설치하여 표시하는 광고물 등 중 그 윗부분까지 높이가 4미터 이상인 옥\n상간판 및 애드벌룬\n2.  「대구광역시 옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 조례」(이하“시 조례”라 한다) 제5조제2항제\n2호에 따른 벽면 이용 간판 중 네온류 또는 전광류를 사용하거나 디지털광고물 등인 경우(개정 2025.7.7.)\n3.  그 밖에 구청장이 필요하다고 인정하여 심의위원회의 심의를 거쳐 정하는 광고물 등", "n_chars": 300, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A03-P01", "article": 3, "article_title": "광고물 등의 허가 및 신고사항 관리", "paragraph": "①", "label": "제3조(광고물 등의 허가 및 신고사항 관리) ①", "section": "본칙", "page_start": 1, "page_end": 2, "raw": "①  구청장은 영 제7조부터 제10조까지의 규정에 따라 광고물의 허가를\n하거나 신고를 수리한 때에는 별지 제1호서식의 허가 및 신고대장에 그 내용을 기록하고 관리하여야 한다. 다만,\n허가 또는 신고 사항에 대한 내용이 전산화된 경우에는 그 전산대장으로 갈음할 수 있다.", "n_chars": 150, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A03-P02", "article": 3, "article_title": "광고물 등의 허가 및 신고사항 관리", "paragraph": "②", "label": "제3조(광고물 등의 허가 및 신고사항 관리) ②", "section": "본칙", "page_start": 2, "page_end": 2, "raw": "②  구청장은 영 제7조제3항 단서에 따라 현수막ㆍ벽보ㆍ전단의 신고를 수리하는 때에는 광고물의 우측 하단\n의 여백에 별지 제2호서식의 검인, 압인 또는 천공을 함으로써 신고필증 교부에 갈음할 수 있다.", "n_chars": 112, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A03-P03", "article": 3, "article_title": "광고물 등의 허가 및 신고사항 관리", "paragraph": "③", "label": "제3조(광고물 등의 허가 및 신고사항 관리) ③", "section": "본칙", "page_start": 2, "page_end": 2, "raw": "③  구청장은 영 제7조 및 제10조에 따라 허가를 하거나 신고를 수리한 광고물 등의 표시기간 종료일 30일전까\n지 그 허가를 받거나 신고를 한 자에게 표시기간 종료를 미리 알려야 한다. 다만, 표시기간이 60일 이내인 경우에\n는 제외한다.", "n_chars": 134, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A04-P00", "article": 4, "article_title": "변경신고 대상 광고물 등", "paragraph": "", "label": "제4조(변경신고 대상 광고물 등)", "section": "본칙", "page_start": 2, "page_end": 2, "raw": "영 제9조제1항 단서 전단에 따라 허가대상 광고물 등 중 다음 각 호의 광고물 등\n을 제외하고는 구청장에게 신고하고 광고내용을 변경할 수 있다.\n1.  타사광고(벽면 이용 간판과 옥상간판을 말한다)를 표시하는 광고물 등\n2.  네온류를 사용하는 광고물 등", "n_chars": 142, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A05-P00", "article": 5, "article_title": "연장신고 대상 광고물 등", "paragraph": "", "label": "제5조(연장신고 대상 광고물 등)", "section": "본칙", "page_start": 2, "page_end": 2, "raw": "영 제10조제2항에 따라 허가대상 광고물 등 중 구청장에게 신고하고 그 표시기간\n을 연장하는 광고물 등은 다음 각 호와 같다. 다만,  네온류ㆍ전광류를 사용하거나 디지털광고물과 타사광고를\n표시하는 광고물 등은 제외한다.\n1.  영 제4조제1항제1호에 따른 벽면 이용 간판\n2.  영 제4조제1항제2호에 따른 돌출간판\n3.  영 제15조제4호나목에 따른 옥상간판과 높이가 4미터 미만인 볼링핀 모형의 옥상간판\n4.  영 제4조제1항제5호에 따른 지주 이용 간판\n5.  영 제4조제1항제6호에 따른 애드벌룬 중 공중에 띄우거나 지면에 설치하는 경우\n6.  영 제37조제2항제3호에 따라 안전점검에 합격한 광고물 등으로 구청장이 원활한 광고물 등의 관리를 위해\n정한 광고물 등\n7.  그 밖에 구청장이 필요하다고 인정하여 심의위원회의 심의를 거쳐 정하는 광고물 등", "n_chars": 424, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A06-P01", "article": 6, "article_title": "전자게시대의 표출관리", "paragraph": "①", "label": "제6조(전자게시대의 표출관리) ①", "section": "본칙", "page_start": 2, "page_end": 3, "raw": "①  영 제16조제5항 및 시 조례 제10조제4항에 따라 설치ㆍ운영하는 전자게시대는\n다음 각 호의 기준에 따라 관리하여야 한다.\n1.  하나의 업소 또는 신청인은 동시에 2개소 이하의 전자게시대에 표시할 수 있으며, 하나의 전자게시대에는\n같은 업소 또는 같은 내용을 시간당 표출비율의 100분의 5 이하로 표출하여야 한다. 다만, 「옥외광고물 등의\n관리와 옥외광고산업 진흥에 관한 법률」(이하 “법”이라 한다) 제6조제2항에 따른 국가 등의 공공목적 광고 또\n는 다른 광고내용의 표시신청이 없는 경우에는 예외로 한다.(개정 2025.7.7.)\n2.  전자게시대에서의 표시기간은 1회 15일 이내로 하며, 같은 업소 또는 같은 내용을 같은 전자게시대에 2회\n이상 계속하여 표시할 수 없다. 다만, 다른 광고내용의 표시신청이 없거나 구청장이 필요하다고 인정하는 경우\n에는 예외로 한다.\n3.  표시신청이 표시 가능한 수량을 초과하는 경우에는 전산에 의한 추첨, 공개추첨, 접수 차례 등 공정한 방법\n으로 표시 대상을 선정하여야 하며, 구청장은 선정방법을 미리 정하여 공고하여야 한다.\n4.  다음 각 목의 어느 하나에 해당하는 사항은 표시할 수 없다.\n가. 법 제5조에 따른 금지광고물 등\n나. 특정 개인 또는 단체를 비방하는 목적의 내용\n다. 그 밖에 공중도덕이나 사회윤리를 침해할 우려가 있다고 판단되어 심의위원회의 심의를 거쳐 구청장이 정\n하는 사항", "n_chars": 700, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A06-P02", "article": 6, "article_title": "전자게시대의 표출관리", "paragraph": "②", "label": "제6조(전자게시대의 표출관리) ②", "section": "본칙", "page_start": 3, "page_end": 3, "raw": "②  그 밖에 표시에 따른 비용의 징수 및 전자게시대의 설치ㆍ관리에 관하여 필요한 사항은 구청장이 심의위원\n회 심의를 거쳐 정하여 공고하는 바에 따른다.", "n_chars": 85, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A07-P00", "article": 7, "article_title": "간판표시계획서의 제출 대상 용도", "paragraph": "", "label": "제7조(간판표시계획서의 제출 대상 용도)", "section": "본칙", "page_start": 3, "page_end": 3, "raw": "영 제23조제1항제2호에서 “조례로 정하는 용도”란 다음 각 호의 건축물\n을 말한다.\n1.  「건축법」 제2조제2항제7호에 따른 판매시설\n2.  「건축법」 제2조제2항제15호에 따른 숙박시설", "n_chars": 106, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A08-P00", "article": 8, "article_title": "자율관리협정", "paragraph": "", "label": "제8조(자율관리협정)", "section": "본칙", "page_start": 3, "page_end": 3, "raw": "영 제26조제2항제7호의 “그 밖에 자율관리협정에 필요한 사항으로서 조례로 정하는 사항”이\n란 다음 각 호의 사항을 말한다.\n1.  자율관리협정의 승계, 변경 및 폐지에 관한 사항\n2.  광고물 등의 위치ㆍ모양ㆍ크기ㆍ색깔을 표시한 디자인 시안(試案)\n3.  광고물 등의 유지ㆍ관리 및 감시활동계획\n4.  자율관리협정의 이행을 위한 사업계획서\n5.  그 밖에 구청장이 자율관리협정에 필요하다고 인정하는 사항", "n_chars": 226, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A09-P01", "article": 9, "article_title": "주민협의회의 운영", "paragraph": "①", "label": "제9조(주민협의회의 운영) ①", "section": "본칙", "page_start": 3, "page_end": 3, "raw": "①  영 제27조제3항에 따라 조례에서 정하는 주민협의회의 업무는 다음 각 호와 같다.\n1.  자율관리협정의 변경 및 폐지의 결정\n2.  자율관리구역의 지정 및 운영을 위한 예산의 집행 및 정산\n3.  그 밖에 구청장이 주민협의회의 업무에 필요하다고 인정하는 사항", "n_chars": 147, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A09-P02", "article": 9, "article_title": "주민협의회의 운영", "paragraph": "②", "label": "제9조(주민협의회의 운영) ②", "section": "본칙", "page_start": 3, "page_end": 4, "raw": "②  영 제27조제4항에 따라 주민협의회의 구성ㆍ운영에 필요한 사항은 다음 각 호와 같다.\n1.  주민협의회는 다음 각 목에 해당하는 사람으로 구성한다.\n가. 해당 자율관리구역 내의 토지 또는 건물의 소유자ㆍ지상권자ㆍ임차권자\n나. 시민단체 및 옥외광고ㆍ디자인 관련 전문가\n다. 해당 지역의 구의회 의원\n2.  주민협의회는 위원장과 부위원장 각 1명을 포함한 10명 이상 20명 이내의 위원으로 구성한다.\n3.  주민협의회의 위원장과 부위원장은 위원 중에서 호선한다.\n4.  위원장은 주민협의회의 업무를 총괄하며, 주민협의회를 소집한다.\n5.  위원장이 부득이한 사유로 직무를 수행할 수 없는 경우에는 부위원장이, 위원장 및 부위원장이 모두 부득이\n한 사유로 직무를 수행할 수 없는 경우에는 위원장이 사전에 지명한 위원이 그 직무를 대행한다.\n6.  주민협의회의 회의는 재적위원 과반수의 출석으로 개의하고, 출석위원 과반수의 찬성으로 의결한다.\n7.  그 밖에 주민협의회의 운영 등에 관하여 필요한 사항은 주민협의회의 의결을 거쳐 위원장이 정할 수 있다.", "n_chars": 533, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A09-P03", "article": 9, "article_title": "주민협의회의 운영", "paragraph": "③", "label": "제9조(주민협의회의 운영) ③", "section": "본칙", "page_start": 4, "page_end": 4, "raw": "③  주민협의회는 자율관리협정의 유효기간을 연장하는 경우에는 유효기간 만료 30일 전까지 구청장에게 영\n제26조제2항 각 호의 자율관리협정을 체결하여 지정을 신청하여야 한다.", "n_chars": 97, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A10-P00", "article": 10, "article_title": "광고물 등 정비시범구역", "paragraph": "", "label": "제10조(광고물 등 정비시범구역)", "section": "본칙", "page_start": 4, "page_end": 4, "raw": "구청장은 영 제28조제3항에 따라 다음 각 호의 절차를 거쳐 광고물 등 정비시범\n구역(이하 “정비시범구역”이라 한다)을 지정하고 운영한다.\n1.  구청장은 수요조사를 거쳐 정비시범구역의 지정목적, 명칭ㆍ위치 및 규모, 사업기간, 사업비 및 예산지원, 광\n고물 등의 디자인 등이 포함된 사업(이하 “정비시범사업”이라 한다) 계획을 수립한다.\n2.  구청장은 제1호에 따른 정비시범사업 계획을 정비시범구역 안의 주민을 대상으로 15일 이상 열람을 하여\n의견을 청취하여야 한다. 이 경우 제시된 의견이 타당하다고 인정하는 때에는 이를 반영하여야 한다.\n3.  구청장은 제2호에 따른 의견수렴 절차가 끝나면 대구광역시장(이하 “시장”이라 한다)과 사전협의를 거친 후\n에 심의위원회의 심의를 거쳐 「행정절차법」 제46조에 따른 행정예고를 통하여 정비시범사업 계획을 고시하여\n야 한다.\n4.  구청장은 정비시범사업이 종료한 후에 광고물 등의 유지ㆍ관리를 위하여 필요하다고 인정하는 경우에는 주\n민협의회를 구성하여 관리할 수 있다. 이 경우 주민협의회의 구성 및 운영은 제9조의 규정을 준용한다.(개정\n2025.7.7.)\n5.  그 밖에 정비시범구역의 지정 및 운영에 필요한 사항은 심의위원회의 심의를 거쳐 구청장이 정할 수 있다.", "n_chars": 626, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A11-P01", "article": 11, "article_title": "광고물 등의 정비 등 지원", "paragraph": "①", "label": "제11조(광고물 등의 정비 등 지원) ①", "section": "본칙", "page_start": 4, "page_end": 4, "raw": "①  구청장은 제10조에 따른 정비시범구역에서 광고물 등을 정비하는 자에게 정\n비에 필요한 비용의 전부 또는 일부를 지원할 수 있다.", "n_chars": 74, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A11-P02", "article": 11, "article_title": "광고물 등의 정비 등 지원", "paragraph": "②", "label": "제11조(광고물 등의 정비 등 지원) ②", "section": "본칙", "page_start": 4, "page_end": 4, "raw": "②  구청장은 법 제5조의2에 따라 광고물 등의 표시방법을 준수하고 광고산업 발전에 기여한 광고업자에 대해\n서는 우수광고업자로 지정하는 등 인센티브 방안을 마련할 수 있다.", "n_chars": 96, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A11-P03", "article": 11, "article_title": "광고물 등의 정비 등 지원", "paragraph": "③", "label": "제11조(광고물 등의 정비 등 지원) ③", "section": "본칙", "page_start": 4, "page_end": 4, "raw": "③  구청장은 법 제5조의2에 따라 광고물 등의 질적 향상과 옥외광고산업의 진흥을 도모하기 위하여 필요한 경\n우에는 광고물 등의 공동 제작 및 디자인 향상을 위한 작업장 등의 설치ㆍ운영에 필요한 운영비의 전부 또는 일\n부를 지원할 수 있다.", "n_chars": 134, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A11-P04", "article": 11, "article_title": "광고물 등의 정비 등 지원", "paragraph": "④", "label": "제11조(광고물 등의 정비 등 지원) ④", "section": "본칙", "page_start": 4, "page_end": 4, "raw": "④  구청장은 법 제3조의 허가 또는 신고 없이 표시ㆍ설치한 입간판, 현수막, 벽보, 전단지 등을 제거 또는 수거\n한 자에게 예산의 범위에서 비용을 지급할 수 있다.", "n_chars": 92, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A11-P05", "article": 11, "article_title": "광고물 등의 정비 등 지원", "paragraph": "⑤", "label": "제11조(광고물 등의 정비 등 지원) ⑤", "section": "본칙", "page_start": 4, "page_end": 4, "raw": "⑤  제4항에 따른 세부사항은 별도로 정하여 운영할 수 있다.", "n_chars": 34, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A12-P01", "article": 12, "article_title": "지역특화발전특구 광고물 등의 특례", "paragraph": "①", "label": "제12조(지역특화발전특구 광고물 등의 특례) ①", "section": "본칙", "page_start": 4, "page_end": 4, "raw": "(제목개정 2025.7.7.)\n①  구청장은 법 제3조 및 제4조의 규정에도 불구하고 「규제자유특구 및 지역특화발전특구에 대한 규제특례법\n」 제11조의 규정에 따라 지정된 지역특화발전특구(이하 “특구”라 한다)에서 특구의 홍보에 필요하다고 인정되어\n특구계획에 반영된 특구 및 특화사업 홍보를 위한 시설의 광고물 등은 영 제24조제1항제1호 각 목의 지역 및 장\n소에 별표 7과 같이 표시할 수 있다.(개정 2025.7.7.)", "n_chars": 237, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A12-P02", "article": 12, "article_title": "지역특화발전특구 광고물 등의 특례", "paragraph": "②", "label": "제12조(지역특화발전특구 광고물 등의 특례) ②", "section": "본칙", "page_start": 5, "page_end": 5, "raw": "②  제1항에 따라 특구 및 특화사업을 홍보하기 위한 광고물 등은 다음 각 호와 같이 표시방법을 완화하여 표시\n하여야 한다.(개정 2025.7.7.)\n1. <삭제 2025.7.7.>\n2. <삭제 2025.7.7.>\n3.  광고물 등에 네온류 또는 전광류를 사용하는 경우에는 광원이 직접 노출되지 않도록 덮개를 씌워 표시하되\n빛이 점멸하지 아니하고 동영상 변화가 없는 경우로 한정한다.\n4.  영 제16조 및 시 조례 제10조에도 불구하고 지주 이용 간판은 다음 각 목의 기준에 따라 표시하여야 한다\n.(개정 2025.7.7.)\n가. 간판의 윗부분까지의 높이는 지면으로부터 10미터를, 1면의 면적(간판이 입체형인 경우에는 가장 넓은 면\n의 단면적을 말한다)은 50제곱미터를,  간판면적의 합계면적은 150제곱미터를 각각 초과할 수 없다.<신설\n2025.7.7.>\n나. 「도로법」에 따른 도로의 갓길로부터 고속국도는 500미터 이상, 자동차 전용도로는 200미터 이상으로 하고,\n그 밖의 도로는 30미터 이상을 이격하여야 한다.<신설 2025.7.7.>\n5.  영 제20조에 따른 시 조례 제16조에도 불구하고 선전탑은 다음 각 목의 기준에 따라 표시할 수 있다.(개정\n2025.7.7.)\n가. 높이는 지면으로부터 15미터 이내로 한다.\n나. 영 제8조제3호 관련 별표 1의 표시기간에 불구하고 30일을 초과하여 표시할 수 있다.\n다. <삭제 2025.7.7.>", "n_chars": 705, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A13-P01", "article": 13, "article_title": "광고물 등의 외국어 병기", "paragraph": "①", "label": "제13조(광고물 등의 외국어 병기) ①", "section": "본칙", "page_start": 5, "page_end": 5, "raw": "①  법 제5조의2제5항에 따라 구청장은 「관광진흥법」에 따른 관광지ㆍ관광단지\n및 관광특구의 일정한 구역을 지정하여 광고물 등에 한글과 외국어를 병기하도록 할 수 있다.", "n_chars": 94, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A13-P02", "article": 13, "article_title": "광고물 등의 외국어 병기", "paragraph": "②", "label": "제13조(광고물 등의 외국어 병기) ②", "section": "본칙", "page_start": 5, "page_end": 5, "raw": "②  구청장은 제1항에 따라 광고물 등을 표시하려면 「행정절차법」 제46조에 따른 행정예고를 통하여 주민의\n의견을 듣고 심의위원회의 심의를 거쳐 한글과 외국어를 병기하는 사항을 고시하여야 한다.", "n_chars": 108, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A13-P03", "article": 13, "article_title": "광고물 등의 외국어 병기", "paragraph": "③", "label": "제13조(광고물 등의 외국어 병기) ③", "section": "본칙", "page_start": 5, "page_end": 5, "raw": "③  제2항에 따라 고시하는 사항은 다음 각 호와 같다.\n1.  관광지ㆍ관광단지 및 관광특구의 범위\n2.  광고물 등의 디자인\n3.  그 밖에 한글과 외국어의 병기에 필요한 사항", "n_chars": 99, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A14-P01", "article": 14, "article_title": "심의위원회의 구성ㆍ운영", "paragraph": "①", "label": "제14조(심의위원회의 구성ㆍ운영) ①", "section": "본칙", "page_start": 5, "page_end": 5, "raw": "(제목개정 2025.7.7.)\n①  심의위원회는 영 제32조에 따라 구성하되, 위원은 다음 각 호의 사람 중에서 구청장이 임명 또는 위촉한다.\n1.  옥외광고ㆍ교통ㆍ환경ㆍ도시계획ㆍ건축ㆍ디자인ㆍ청소년 등 광고물 등 관련 업무를 담당하는 공무원\n2.  국어ㆍ옥외광고ㆍ교통ㆍ환경ㆍ도시계획ㆍ건축ㆍ디자인ㆍ청소년 등 광고물 등 관련분야 전문가\n3.  그 밖에 광고물 등에 관한 학식과 경험이 풍부한 사람", "n_chars": 219, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A14-P02", "article": 14, "article_title": "심의위원회의 구성ㆍ운영", "paragraph": "②", "label": "제14조(심의위원회의 구성ㆍ운영) ②", "section": "본칙", "page_start": 5, "page_end": 5, "raw": "②  심의위원회는 심의안건을 문서의 접수일 또는 사유 발생일로부터 20일 이내에 심의하고 그 결과를 처리하\n여야 한다. 다만, 불가피한 사정이 있는 경우에는 「민원처리에 관한 법률 시행령」 제21조에 따라 처리기간을 연\n장할 수 있다.(개정 2021.9.30)", "n_chars": 145, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A14-P03", "article": 14, "article_title": "심의위원회의 구성ㆍ운영", "paragraph": "③", "label": "제14조(심의위원회의 구성ㆍ운영) ③", "section": "본칙", "page_start": 6, "page_end": 6, "raw": "③  심의위원회의 효율적인 운영과 심의를 위하여 필요한 경우에는 위원이 직접 출석하지 않고 이메일 등 정보\n통신망, 화상회의, 서면 등의 방법으로 심의할 수 있으며, 대상ㆍ방법 또는 절차 등 필요한 사항은 위원회 의결을\n거쳐 위원장이 따로 정할 수 있다.", "n_chars": 142, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A14-P04", "article": 14, "article_title": "심의위원회의 구성ㆍ운영", "paragraph": "④", "label": "제14조(심의위원회의 구성ㆍ운영) ④", "section": "본칙", "page_start": 6, "page_end": 6, "raw": "④  심의위원회는 광고물 등의 표시ㆍ설치와 관련한 당사자의 요청이 있거나 심의를 위하여 필요한 경우에는\n관계공무원ㆍ전문가ㆍ신청인 또는 이해관계인을 참석하도록 하여 의견을 들을 수 있다.", "n_chars": 103, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A14-P05", "article": 14, "article_title": "심의위원회의 구성ㆍ운영", "paragraph": "⑤", "label": "제14조(심의위원회의 구성ㆍ운영) ⑤", "section": "본칙", "page_start": 6, "page_end": 6, "raw": "⑤  영 제32조제5항에 따른 소위원회는 심의위원장이 심의위원회 위원 중에서 지명하여 위원장을 포함한 3명\n이상 5명 이하의 위원으로 구성하고, 위원장은 옥외광고업무 담당과장으로 한다. 이 경우 관계공무원인 위원의\n수는 위원장을 포함한 위원수의 2분의 1 미만이어야 한다.", "n_chars": 152, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A14-P06", "article": 14, "article_title": "심의위원회의 구성ㆍ운영", "paragraph": "⑥", "label": "제14조(심의위원회의 구성ㆍ운영) ⑥", "section": "본칙", "page_start": 6, "page_end": 6, "raw": "⑥  위원은 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원회의 심의ㆍ의결에서 제척된다.\n1.  위원 또는 그 배우자나 배우자였던 자가 해당 단체의 임원이거나 임원이었던 경우\n2.  위원이 당사자와 친족관계에 있는 경우\n3.  위원 또는 위원이 속한 법인ㆍ단체가 대리인으로 관여하거나 관여했던 경우\n4.  위원이 해당사항에 관하여 용역을 수행하거나 그 밖의 방법으로 직접 관여한 경우\n5.  그 밖에 당사자와 이해관계가 있다고 인정되는 경우", "n_chars": 250, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A14-P07", "article": 14, "article_title": "심의위원회의 구성ㆍ운영", "paragraph": "⑦", "label": "제14조(심의위원회의 구성ㆍ운영) ⑦", "section": "본칙", "page_start": 6, "page_end": 6, "raw": "⑦  위원회 심의ㆍ의결의 이해당사자는 위원에게 공정을 기대하기 어려운 특별한 사정이 있는 경우에는 기피신\n청을 할 수 있다.", "n_chars": 69, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A14-P08", "article": 14, "article_title": "심의위원회의 구성ㆍ운영", "paragraph": "⑧", "label": "제14조(심의위원회의 구성ㆍ운영) ⑧", "section": "본칙", "page_start": 6, "page_end": 6, "raw": "⑧  위원 본인이 제6항의 사유에 해당하는 경우에는 스스로 그 사안의 심의ㆍ의결을 회피할 수 있다.", "n_chars": 55, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A14-P09", "article": 14, "article_title": "심의위원회의 구성ㆍ운영", "paragraph": "⑨", "label": "제14조(심의위원회의 구성ㆍ운영) ⑨", "section": "본칙", "page_start": 6, "page_end": 6, "raw": "⑨  심의위원회의 심의대상ㆍ방법ㆍ절차, 안건의 제출방법, 심의기준 등 심의에 필요한 사항은 심의위원회의\n의결을 거쳐 위원장이 따로 정하며, 소위원회는 심의위원회가 위임한 사항을 심의하되 심의위원회의 해당 규정\n을 준용한다.", "n_chars": 124, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A14-P10", "article": 14, "article_title": "심의위원회의 구성ㆍ운영", "paragraph": "⑩", "label": "제14조(심의위원회의 구성ㆍ운영) ⑩", "section": "본칙", "page_start": 6, "page_end": 6, "raw": "⑩  제2항에 따른 심의위원회의 심의 결과에 이의가 있는 자는 심의 결과를 통보받은 날부터 30일 이내에 구청\n장에게 심의위원회의 재심의를 신청할 수 있다. 이 경우 심의위원회는 제2항에 따른 처리기간 내에 재심의안건\n을 처리해야 한다.<신설 2021.9.30>(개정 2025.7.7.)", "n_chars": 160, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A15-P01", "article": 15, "article_title": "심의위원회의 심의사항 등", "paragraph": "①", "label": "제15조(심의위원회의 심의사항 등) ①", "section": "본칙", "page_start": 6, "page_end": 6, "raw": "①  영 제33조제2호에 따라 심의위원회의 심의를 거치게 하거나 심의를 부칠\n수 있도록 한 사항은 다음 각 호와 같다.\n1.  법과 영에서 규정한 사항과 이 조례 및 시 조례에서 심의위원회의 심의를 거치도록 규정한 사항\n2.  옥상간판(높이 1.8미터 이내의 간판은 제외하고, 옥상에 고정하는 애드벌룬은 포함한다)의 표시허가에 관한\n사항\n3.  표시면적 20제곱미터 이상의 지주 이용 간판의 표시허가에 관한 사항\n4.  1면의 표시면적이 10제곱미터 이상의  네온류ㆍ전광류를 사용하거나 디지털광고물의 표시허가에 관한 사\n항\n5.  그 밖에 구청장이 광고물 등의 관리를 위하여 특히 필요하다고 인정하여 심의에 부치도록 한 사항", "n_chars": 349, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A15-P02", "article": 15, "article_title": "심의위원회의 심의사항 등", "paragraph": "②", "label": "제15조(심의위원회의 심의사항 등) ②", "section": "본칙", "page_start": 6, "page_end": 7, "raw": "②  소위원회에서 심의를 거치게 하거나 심의를 부칠 수 있도록 한 사항은 다음 각 호와 같다.\n1.  심의위원회에서 소위원회의 심의사항으로 정하는 사항\n2.  그 밖에 구청장이 소위원회에서 심의하는 것이 효율적이라고 인정하여 심의에 부치도록 하는 사항", "n_chars": 140, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A15-P03", "article": 15, "article_title": "심의위원회의 심의사항 등", "paragraph": "③", "label": "제15조(심의위원회의 심의사항 등) ③", "section": "본칙", "page_start": 7, "page_end": 7, "raw": "③  위원장은 심의위원회 또는 소위원회의 효율적인 심의 등을 위하여 이메일, 서면, 회상회의 등의 방법으로\n심의하게 할 수 있다.", "n_chars": 72, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A15-P04", "article": 15, "article_title": "심의위원회의 심의사항 등", "paragraph": "④", "label": "제15조(심의위원회의 심의사항 등) ④", "section": "본칙", "page_start": 7, "page_end": 7, "raw": "④  심의위원회 또는 소위원회는 제1항의 사항을 심의하기 위하여 필요한 경우에는 관계공무원ㆍ전문가ㆍ이해\n관계인을 참석시켜 의견을 들을 수 있다.", "n_chars": 80, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A15-P05", "article": 15, "article_title": "심의위원회의 심의사항 등", "paragraph": "⑤", "label": "제15조(심의위원회의 심의사항 등) ⑤", "section": "본칙", "page_start": 7, "page_end": 7, "raw": "⑤  심의안건의 제출방법, 심의기준 등 심의위원회 및 소위원회의 운영에 관하여 필요한 사항은 심의위원회의\n의결을 거쳐 위원장이 정한다.", "n_chars": 75, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A16-P00", "article": 16, "article_title": "안전점검 업무를 위탁받을 수 있는 자", "paragraph": "", "label": "제16조(안전점검 업무를 위탁받을 수 있는 자)", "section": "본칙", "page_start": 7, "page_end": 7, "raw": "영 제38조제1항에 따라 안전점검 업무를 위탁받을 수 있는 자는 다\n음 각 호의 어느 하나와 같다.\n1.  「건축사법」에 따라 건축사 사무소의 등록을 한 자\n2.  「건축사법」에 따른 건축사 관련단체 또는 비영리법인\n3.  「국가기술자격법」(「자격기본법」 제17조에 따라 국가공인을 받은 민간자격을 포함한다. 이하 같다)에 따른\n옥외광고ㆍ건축ㆍ전기분야의 기술자격을 취득한 자의 단체 또는 비영리법인\n4.  그 밖에 제1호부터 제3호까지 규정된 자와 동등한 안전점검 능력을 갖춘 것으로 인정되는 자", "n_chars": 277, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A17-P00", "article": 17, "article_title": "안전점검 업무를 위탁받을 수 있는 자의 기준 등", "paragraph": "", "label": "제17조(안전점검 업무를 위탁받을 수 있는 자의 기준 등)", "section": "본칙", "page_start": 7, "page_end": 7, "raw": "영 제38조제2항에 따라 안전점검 업무를 위탁받을 수 있\n는 자는 다음 각 호와 같이 검사 시설 및 장비, 검사원의 자격 및 인원을 갖추어야 하며, 구청장은 구체적인 기준\n을 정하여 공고하여야 한다.\n1.  사무실\n2.  작업차량, 사다리, 절연저항계, 카메라, 망원경\n3.  「국가기술자격법」에 따른 옥외광고ㆍ건축ㆍ전기분야의 기술자격을 취득한 자(분야별로 1인 이상이 포함되\n어야 한다)\n4.  그 밖에 구청장이 안전점검에 필요하다고 인정하여 지정하는 시설 또는 장비", "n_chars": 262, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A18-P01", "article": 18, "article_title": "안전점검의 위탁절차 등", "paragraph": "①", "label": "제18조(안전점검의 위탁절차 등) ①", "section": "본칙", "page_start": 7, "page_end": 7, "raw": "①  구청장은 제16조에 따라 안전점검 업무를  위탁받을 수 있는 자 중에서 하나\n이상을 지정하여 안전점검 업무를 위탁할 수 있다.", "n_chars": 73, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A18-P02", "article": 18, "article_title": "안전점검의 위탁절차 등", "paragraph": "②", "label": "제18조(안전점검의 위탁절차 등) ②", "section": "본칙", "page_start": 7, "page_end": 7, "raw": "②  구청장은 제1항에 따라 안전점검 업무를 위탁하고자 할 때에는 위탁받을 수 있는 자의 자격, 위탁기간, 위\n탁받을 자의 임무, 관계서류의 제출시기, 위탁받을 자의 선정방법 등을 명시한 위탁계획을 공고하여야 한다.", "n_chars": 120, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A18-P03", "article": 18, "article_title": "안전점검의 위탁절차 등", "paragraph": "③", "label": "제18조(안전점검의 위탁절차 등) ③", "section": "본칙", "page_start": 7, "page_end": 7, "raw": "③  제1항에 따라 안전점검 업무를 위탁받고자 하는 자는 별지 제3호서식의 위탁지정신청서를 구청장에게 제\n출하여야 한다.", "n_chars": 67, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A18-P04", "article": 18, "article_title": "안전점검의 위탁절차 등", "paragraph": "④", "label": "제18조(안전점검의 위탁절차 등) ④", "section": "본칙", "page_start": 7, "page_end": 7, "raw": "④  구청장은 제1항에 따라 심의위원회의 심의를 거쳐 안전점검 업무를 위탁할 자를 지정할 때에는 별지 제4호\n서식의 위탁지정서를 교부하여야 한다.(개정 2025.7.7.)", "n_chars": 95, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A18-P05", "article": 18, "article_title": "안전점검의 위탁절차 등", "paragraph": "⑤", "label": "제18조(안전점검의 위탁절차 등) ⑤", "section": "본칙", "page_start": 7, "page_end": 7, "raw": "⑤  제1항에 따른 위탁기간은 3년 이내로 하며, 그 기간을 연장하여 위탁할 수 있다.", "n_chars": 48, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A18-P06", "article": 18, "article_title": "안전점검의 위탁절차 등", "paragraph": "⑥", "label": "제18조(안전점검의 위탁절차 등) ⑥", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "⑥  구청장은 제1항에 따라 안전점검 업무를 위탁할 때에는 위탁받은 자의 명칭 및 위탁기간 등을 고시하여야\n하며, 필요하다고 인정하는 경우에는 안전점검 업무를 수행하는 자에게 별지 제5호서식의 검사원증을 발급할 수\n있다.", "n_chars": 123, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A19-P01", "article": 19, "article_title": "안전점검의 절차 및 검사요령 등", "paragraph": "①", "label": "제19조(안전점검의 절차 및 검사요령 등) ①", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "①  구청장은 안전점검을 별지 제6호서식의 안전점검 검사서에 따라 점\n검하여야 하며, 그 내용을 별지 제7호서식의 대장에 기록하고 관리하여야 한다. 다만, 안전점검 대장 내용이 전산\n화된 때에는 그 전산대장으로 갈음할 수 있다.", "n_chars": 127, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A19-P02", "article": 19, "article_title": "안전점검의 절차 및 검사요령 등", "paragraph": "②", "label": "제19조(안전점검의 절차 및 검사요령 등) ②", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "②  구청장은 안전점검에 관한 전문 지식을 갖춘 공무원을 검사공무원으로 지정하여 직접 안전점검을 실시할\n수 있다.", "n_chars": 63, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A19-P03", "article": 19, "article_title": "안전점검의 절차 및 검사요령 등", "paragraph": "③", "label": "제19조(안전점검의 절차 및 검사요령 등) ③", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "③  안전점검 업무를 위탁받은 자는 영 제37조제1항에 규정한 안전점검의 기준에 따라 안전점검을 실시하고 별\n지 제6호서식에 따라 검사 결과를 구청장에게 제출하여야 한다.", "n_chars": 95, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A19-P04", "article": 19, "article_title": "안전점검의 절차 및 검사요령 등", "paragraph": "④", "label": "제19조(안전점검의 절차 및 검사요령 등) ④", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "④  안전점검 업무를 위탁받은 자는 안전점검 업무를 수행하면서 관계법령 및 이 조례에 위반한 사실을 발견한\n때에는 이를 구청장에게 즉시 보고하여야 한다. 다만, 현장에서 시정조치 할 수 있는 경미한 사항은 그러하지 아\n니하다.", "n_chars": 126, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A19-P05", "article": 19, "article_title": "안전점검의 절차 및 검사요령 등", "paragraph": "⑤", "label": "제19조(안전점검의 절차 및 검사요령 등) ⑤", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "⑤  구청장은 제1항에 따라 안전점검 결과를 접수하여 광고물 등이 안전점검에 합격한 때에는 지체 없이 영 제\n37조제4항의 안전점검증명서를 발급하여야 한다.", "n_chars": 87, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A20-P01", "article": 20, "article_title": "지정게시대의 위탁 등", "paragraph": "①", "label": "제20조(지정게시대의 위탁 등) ①", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "(제목개정 2025.7.7.)\n①  구청장은 시 조례 제10조제4항, 제12조제3항 및 제14조에 따른 전자게시대, 현수막 지정게시대, 지정벽보\n판(이하 “지정게시대”라 한다)의 효율적인 관리 등을 위하여 지정게시대의 관리능력이 있다고 인정되는 법인 또\n는 단체 등에게 지정게시대의 관리업무를 위탁할 수 있다.(개정 2025.7.7.)", "n_chars": 187, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A20-P02", "article": 20, "article_title": "지정게시대의 위탁 등", "paragraph": "②", "label": "제20조(지정게시대의 위탁 등) ②", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "②  구청장은 제1항에 따라 지정게시대의 관리업무를 위탁하고자 할 때에는 위탁받을 수 있는 자의 자격, 위탁\n기간, 위탁받을 자의 임무, 관계서류의 제출시기, 위탁받을 자의 선정방법 등을 명시한 위탁계획을 공고하여야 한\n다.", "n_chars": 125, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A20-P03", "article": 20, "article_title": "지정게시대의 위탁 등", "paragraph": "③", "label": "제20조(지정게시대의 위탁 등) ③", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "③  제2항에 따라 지정게시대의 수탁자를 선정하려는 경우에는 공개경쟁을 원칙으로 한다. 다만, 다음과 같은\n경우에는 수의계약 등 제한방식으로 수탁자를 선정할 수 있다.(개정 2025.7.7.)\n1.  「지방자치단체를 당사자로 하는 계약에 관한 법률 시행령」 제25조에 따른 수의계약에 해당되는 경우\n2.  그 외 다른 법령 등에 따라 수의계약으로 할 수 있는 경우", "n_chars": 203, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A20-P04", "article": 20, "article_title": "지정게시대의 위탁 등", "paragraph": "④", "label": "제20조(지정게시대의 위탁 등) ④", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "④  수탁기관을 선정하려는 경우에는 신청서와 함께 위탁사무의 사업계획서 등을 제출하게 하고, 수탁자는 제\n15조에 따른 심의위원회의 심의를 거쳐 선정하여야 한다.", "n_chars": 90, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A20-P05", "article": 20, "article_title": "지정게시대의 위탁 등", "paragraph": "⑤", "label": "제20조(지정게시대의 위탁 등) ⑤", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "⑤  위탁기간은 3년으로 한다.", "n_chars": 17, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A20-P06", "article": 20, "article_title": "지정게시대의 위탁 등", "paragraph": "⑥", "label": "제20조(지정게시대의 위탁 등) ⑥", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "⑥  제3항에도 불구하고, 공개모집 외의 방법으로 수탁기관을 선정할 경우에는 심의위원회의 사전 심의를 거쳐\n야 한다.", "n_chars": 65, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A20-P07", "article": 20, "article_title": "지정게시대의 위탁 등", "paragraph": "⑦", "label": "제20조(지정게시대의 위탁 등) ⑦", "section": "본칙", "page_start": 8, "page_end": 8, "raw": "⑦  그 밖에 지정게시대의 위탁 및 관리에 필요한 사항은 구청장이 따로 정할 수 있다.", "n_chars": 48, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A21-P00", "article": 21, "article_title": "수탁기관의 선정기준", "paragraph": "", "label": "제21조(수탁기관의 선정기준)", "section": "본칙", "page_start": 9, "page_end": 9, "raw": "구청장은 수탁기관을 선정할 때에는 다음 각 호의 사항을 종합적으로 검토하여야 한\n다.\n1.  위탁사무의 수행에 필요한 인력ㆍ기구ㆍ시설ㆍ장비\n2.  재정부담 능력, 책임능력과 공신력\n3.  위탁사무 관련 분야에 대한 전문성 확보여부 및 사무처리 실적\n4.  수탁기관의 기능과 위탁사무의 연관성\n5.  사업운영의 투명성 등 그 밖에 필요한 사항", "n_chars": 190, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A22-P01", "article": 22, "article_title": "지도ㆍ감독 및 성과평가 등", "paragraph": "①", "label": "제22조(지도ㆍ감독 및 성과평가 등) ①", "section": "본칙", "page_start": 9, "page_end": 9, "raw": "①  구청장은 수탁기관에 대하여 운영과 관련하여 필요한 사항을 보고하게 하\n거나 위탁업무 지도ㆍ감독에 필요한 서류 등을 검사하고 성과평가를 실시하여야 한다.(개정 2025.7.7.)", "n_chars": 101, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A22-P02", "article": 22, "article_title": "지도ㆍ감독 및 성과평가 등", "paragraph": "②", "label": "제22조(지도ㆍ감독 및 성과평가 등) ②", "section": "본칙", "page_start": 9, "page_end": 9, "raw": "②  구청장은 수탁기관에 대하여 연 1회 이상 지도ㆍ점검을 하여야 한다.(개정 2025.7.7.)", "n_chars": 54, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A22-P03", "article": 22, "article_title": "지도ㆍ감독 및 성과평가 등", "paragraph": "③", "label": "제22조(지도ㆍ감독 및 성과평가 등) ③", "section": "본칙", "page_start": 9, "page_end": 9, "raw": "③  구청장은 제1항에 따른 보고ㆍ검사 및 지도ㆍ점검결과, 운영에 위법 또는 부당한 사항이 있다고 인정될 때\n에는 수탁기관에 시정명령 등 필요한 조치를 할 수 있다.(개정 2025.7.7.)", "n_chars": 106, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A23-P01", "article": 23, "article_title": "위탁의 취소 등", "paragraph": "①", "label": "제23조(위탁의 취소 등) ①", "section": "본칙", "page_start": 9, "page_end": 9, "raw": "①  구청장은 수탁기관이 다음 각 호의 어느 하나에 해당하는 경우에는 시정명령을 하거나\n위탁계약을 취소할 수 있다. 다만, 제1호의 경우에는 취소하여야 한다.\n1.  거짓 또는 부정한 방법으로 위탁을 받은 경우\n2.  정당한 사유 없이 시정명령을 이행하지 않았을 경우\n3.  협약서 및 관련규정을 위반하거나, 그에 따른 의무를 성실히 이행하지 않는 경우\n4.  지도ㆍ감독 결과 수탁기관이 위탁사무를 수행할 능력이 없다고 판단될 때\n5.  수탁기관이 불가피한 사유로 계약 해지를 원할 경우\n6.  그 밖에 위탁운영을 할 수 없는 사유가 발생하였을 때", "n_chars": 306, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A23-P02", "article": 23, "article_title": "위탁의 취소 등", "paragraph": "②", "label": "제23조(위탁의 취소 등) ②", "section": "본칙", "page_start": 9, "page_end": 9, "raw": "②  구청장이 제1항에 따라 위탁계약을 해지 또는 취소하려는 경우에는 그 사유를 문서로 수탁기관에 통보하고\n의견진술의 기회를 주어야 한다.", "n_chars": 77, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A23-P03", "article": 23, "article_title": "위탁의 취소 등", "paragraph": "③", "label": "제23조(위탁의 취소 등) ③", "section": "본칙", "page_start": 9, "page_end": 9, "raw": "③  제1항제5호에 따라 수탁기관이 계약을 해지하려는 경우에는 3개월 전에 그 사유를 서면으로 구청장에게 통\n보하여야 한다. 다만, 천재지변 등 불가피한 사유가 있을 때에는 예외로 한다.", "n_chars": 104, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A23-P04", "article": 23, "article_title": "위탁의 취소 등", "paragraph": "④", "label": "제23조(위탁의 취소 등) ④", "section": "본칙", "page_start": 9, "page_end": 9, "raw": "④  수탁기관은 제1항에 따라 위탁계약이 해지 또는 취소되는 경우에는 시설의 원상회복 등 필요한 조치를 하\n여야 한다.", "n_chars": 66, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A24-P01", "article": 24, "article_title": "제거된 광고물 등의 관리 등", "paragraph": "①", "label": "제24조(제거된 광고물 등의 관리 등) ①", "section": "본칙", "page_start": 9, "page_end": 9, "raw": "①  구청장은 영 제40조에 따라 광고물 등을 제거한 경우에는 그 광고물 등이\n있던 곳에 제거한 취지와 그 광고물 등의 보관장소 등을 표시하여야 한다. 다만, 표시하기 곤란한 광고물 등에 해\n당하는 경우에는 예외로 한다.", "n_chars": 123, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A24-P02", "article": 24, "article_title": "제거된 광고물 등의 관리 등", "paragraph": "②", "label": "제24조(제거된 광고물 등의 관리 등) ②", "section": "본칙", "page_start": 9, "page_end": 10, "raw": "②  영 제40조제2항에 따라 조례로 정하는 사항은 다음 각 호와 같다.\n1.  광고물 등의 종류 및 수량\n2.  광고물 등의 표시 내용\n3.  위반 장소 및 위치\n4.  제거한 시간, 보관 장소 및 담당자 등", "n_chars": 117, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A24-P03", "article": 24, "article_title": "제거된 광고물 등의 관리 등", "paragraph": "③", "label": "제24조(제거된 광고물 등의 관리 등) ③", "section": "본칙", "page_start": 10, "page_end": 10, "raw": "③  구청장은 제2항에 따라 광고물 등을 보관한 경우에는 별지 제8호서식의 대장에 기록하고 이를 비치하여 영\n제40조제1항의 관리자 등이 열람할 수 있도록 하여야 한다.", "n_chars": 94, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A24-P04", "article": 24, "article_title": "제거된 광고물 등의 관리 등", "paragraph": "④", "label": "제24조(제거된 광고물 등의 관리 등) ④", "section": "본칙", "page_start": 10, "page_end": 10, "raw": "④  구청장은 영 제41조에 따라 광고물 등을 반환하고자 하는 때에는 별지 제9호서식에 따른다.", "n_chars": 53, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A25-P01", "article": 25, "article_title": "행정대집행의 특례 및 비용청구 등", "paragraph": "①", "label": "제25조(행정대집행의 특례 및 비용청구 등) ①", "section": "본칙", "page_start": 10, "page_end": 10, "raw": "①  법 제10조의2제1항에 따라 구청장은 추락 등 급박한 위험이 있는\n광고물 등과 불법 입간판ㆍ현수막ㆍ벽보ㆍ전단 등에 대하여 즉시 제거할 수 있는 전문인력과 장비를 갖추거나\n위탁할 수 있다.", "n_chars": 107, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A25-P02", "article": 25, "article_title": "행정대집행의 특례 및 비용청구 등", "paragraph": "②", "label": "제25조(행정대집행의 특례 및 비용청구 등) ②", "section": "본칙", "page_start": 10, "page_end": 10, "raw": "②  구청장은 제1항에 따라 제거할 때 소요되는 비용 등을 산정하여 법  제10조제2항에 따라 관리자 등에 징수\n할 수 있다.", "n_chars": 70, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A26-P00", "article": 26, "article_title": "이행강제금의 부과기준", "paragraph": "", "label": "제26조(이행강제금의 부과기준)", "section": "본칙", "page_start": 10, "page_end": 10, "raw": "영 제43조제1항에 따른 이행강제금의 세부 부과기준은 별표 1과 같다.", "n_chars": 39, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A27-P01", "article": 27, "article_title": "옥외광고사업 종사자 등에 대한 교육", "paragraph": "①", "label": "제27조(옥외광고사업 종사자 등에 대한 교육) ①", "section": "본칙", "page_start": 10, "page_end": 10, "raw": "(제목개정 2025.7.7.)\n①  구청장은 영 제49조제2항에 따른 옥외광고사업 종사자 등의 교육을 별표 2와 같이 실시하여야 한다.", "n_chars": 75, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A27-P02", "article": 27, "article_title": "옥외광고사업 종사자 등에 대한 교육", "paragraph": "②", "label": "제27조(옥외광고사업 종사자 등에 대한 교육) ②", "section": "본칙", "page_start": 10, "page_end": 10, "raw": "②  구청장은 매년 10월말까지 다음 각 호의 내용을 포함한 다음 연도의 교육계획을 수립하여 이를 공고하여야\n한다.\n1.  교육의 종류별 실시시기ㆍ내용ㆍ시간 및 장소\n2.  교육 대상자\n3.  교육 실시방법ㆍ절차 및 비용\n4.  그 밖에 교육에 필요한 사항", "n_chars": 143, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A27-P03", "article": 27, "article_title": "옥외광고사업 종사자 등에 대한 교육", "paragraph": "③", "label": "제27조(옥외광고사업 종사자 등에 대한 교육) ③", "section": "본칙", "page_start": 10, "page_end": 10, "raw": "③  구청장은 교육을 실시하기 15일 전까지 교육대상자를 확정하여 개별통지를 하여야 하며, 교육을 받지 아니\n한 자에 대하여는 보충교육을 실시하여야 한다. 이 경우 제1항의 규정을 준용한다.", "n_chars": 106, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A27-P04", "article": 27, "article_title": "옥외광고사업 종사자 등에 대한 교육", "paragraph": "④", "label": "제27조(옥외광고사업 종사자 등에 대한 교육) ④", "section": "본칙", "page_start": 10, "page_end": 10, "raw": "④  영 제49조제1항제1호에 따라 신규로 옥외광고사업에 종사하려는 사람과 영 제49조제1항제2호에 따라 안\n전점검업무를 위탁받은 사람(종업원 포함)은 제3항에도 불구하고 구청장이 실시하는 교육을 받을 수 있다.", "n_chars": 118, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A27-P05", "article": 27, "article_title": "옥외광고사업 종사자 등에 대한 교육", "paragraph": "⑤", "label": "제27조(옥외광고사업 종사자 등에 대한 교육) ⑤", "section": "본칙", "page_start": 10, "page_end": 10, "raw": "⑤  구청장은 제3항 및 제4항에 따라 교육을 받은 자에 대하여는 별지 제11호서식의 수료필증을 교부하고 별지\n제12호서식의 교육이수대장에 그 내용을 기록하고 관리하여야 한다.", "n_chars": 98, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A27-P06", "article": 27, "article_title": "옥외광고사업 종사자 등에 대한 교육", "paragraph": "⑥", "label": "제27조(옥외광고사업 종사자 등에 대한 교육) ⑥", "section": "본칙", "page_start": 10, "page_end": 10, "raw": "⑥  구청장은 교육에 필요한 비용의 일부를 교육을 받는 사람에게 부담하도록 할 수 있다.", "n_chars": 49, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A27-P07", "article": 27, "article_title": "옥외광고사업 종사자 등에 대한 교육", "paragraph": "⑦", "label": "제27조(옥외광고사업 종사자 등에 대한 교육) ⑦", "section": "본칙", "page_start": 10, "page_end": 11, "raw": "⑦  교육대상자가 다음 각 호의 어느 하나에 해당하는 사유로 인하여 교육을 받을 수 없는 경우에는 사전에 관\n계 증명서류를 붙여 별지 제13호서식의 교육불참신고서를 제출한 때에는 법 제20조제2항에 따른 과태료를 부과\n하지 아니할 수 있다.\n1.  질병 또는 심신장애로 교육에 응할 수 없을 때\n2.  다른 법률의 규정에 따라 구속 중일 때\n3.  「예비군법」및 「민방위기본법」에 따른 교육훈련기간과 중복된 때(개정 2025.7.7.)\n4.  그 밖에 관혼상제, 재해 등 부득이한 사유로 교육에 응할 수 없을 때", "n_chars": 286, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A28-P01", "article": 28, "article_title": "교육의 위탁 등", "paragraph": "①", "label": "제28조(교육의 위탁 등) ①", "section": "본칙", "page_start": 11, "page_end": 11, "raw": "①  구청장은 영 제50조제2항에 따라 옥외광고사업 종사자 등의 교육을 위탁하여 실시하\n고자 하는 때에는 시설기준, 위탁기간, 관계서류의 제출시기, 위탁받을 자의 임무, 자격요건 및 선정방법 등을 명\n시한 위탁계획을 공고하여야 하며, 위탁받고자 하는 자는 별지 제14호서식의 교육위탁지정신청서를 구청장에게\n제출하여야 한다.", "n_chars": 180, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A28-P02", "article": 28, "article_title": "교육의 위탁 등", "paragraph": "②", "label": "제28조(교육의 위탁 등) ②", "section": "본칙", "page_start": 11, "page_end": 11, "raw": "②  구청장은 제1항에 따른 교육 위탁지정신청자 중에서 심의위원회의 심의를 거쳐 위탁받은 자를 지정하는 경\n우에는 별지 제15호서식의 교육위탁지정서를 교부하고, 위탁받은 자의 명칭, 대표자 성명, 주소, 위탁기간 및 그\n밖에 필요한 사항을 고시하여야 한다.(개정 2025.7.7.)", "n_chars": 157, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A28-P03", "article": 28, "article_title": "교육의 위탁 등", "paragraph": "③", "label": "제28조(교육의 위탁 등) ③", "section": "본칙", "page_start": 11, "page_end": 11, "raw": "③  구청장은 제2항에 따른 교육의 위탁기간을 심의위원회의 심의를 거쳐 정하되 그 기간을 연장하여 위탁할\n수 있다.", "n_chars": 64, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A28-P04", "article": 28, "article_title": "교육의 위탁 등", "paragraph": "④", "label": "제28조(교육의 위탁 등) ④", "section": "본칙", "page_start": 11, "page_end": 11, "raw": "④  제2항에 따라 교육을 위탁받은 자는 제27조제2항에 규정한 사항을 포함한 교육계획을 수립하여 12월말까\n지 구청장에게 제출하여야 한다.", "n_chars": 78, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A28-P05", "article": 28, "article_title": "교육의 위탁 등", "paragraph": "⑤", "label": "제28조(교육의 위탁 등) ⑤", "section": "본칙", "page_start": 11, "page_end": 11, "raw": "⑤  교육을 위탁받은 자가 교육을 실시한 때에는 제27조제5항의 교육이수대장을 작성하여 구청장에게 그 결과\n를 보고하여야 하고, 구청장은 교육을 수료한 자에게 교육수료필증을 교부하여야 한다.", "n_chars": 106, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A28-P06", "article": 28, "article_title": "교육의 위탁 등", "paragraph": "⑥", "label": "제28조(교육의 위탁 등) ⑥", "section": "본칙", "page_start": 11, "page_end": 11, "raw": "⑥  교육을 위탁받은 자는 제5항에 따라 교육을 실시하는 경우에는 구청장이 별도로 정하는 바에 따라 교육에\n필요한 비용을 교육을 받는 자에게 부담하도록 할 수 있다. 이 경우 구청장은 제27조제2항제3호에 따라 그 금액\n과 산출근거를 사전에 공고하여야 한다.", "n_chars": 144, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A28-P07", "article": 28, "article_title": "교육의 위탁 등", "paragraph": "⑦", "label": "제28조(교육의 위탁 등) ⑦", "section": "본칙", "page_start": 11, "page_end": 11, "raw": "⑦  교육을 위탁받은 자는 제5항에 따른 교육을 실시한 후에 그 교육실시결과, 교육비용의 수납 및 집행내역 등\n을 구청장에게 지체 없이 보고하여야 한다.", "n_chars": 85, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A28-P08", "article": 28, "article_title": "교육의 위탁 등", "paragraph": "⑧", "label": "제28조(교육의 위탁 등) ⑧", "section": "본칙", "page_start": 11, "page_end": 11, "raw": "⑧  구청장은 제1항부터 제7항까지의 규정에도 불구하고 법 제11조의4에 따른 한국옥외광고센터에서 개설한\n사이버교육과정을 이수한 경우에는 교육을 수료한 것으로 본다.", "n_chars": 92, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A29-P01", "article": 29, "article_title": "수수료", "paragraph": "①", "label": "제29조(수수료) ①", "section": "본칙", "page_start": 11, "page_end": 11, "raw": "①  법 제17조에 따른 수수료는 다음 각 호와 같다.\n1.  법 제3조제1항에 따른 광고물 등의 허가 또는 신고 수수료는 별표 3과 같다.\n2.  법 제9조제1항에 따른 광고물 등의 안전점검 수수료는 별표 4와 같다.\n3.  법 제11조제1항에 따른 옥외광고사업 등록 수수료는 별표 5와 같다.(개정 2025.7.7.)", "n_chars": 179, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-A29-P02", "article": 29, "article_title": "수수료", "paragraph": "②", "label": "제29조(수수료) ②", "section": "본칙", "page_start": 11, "page_end": 11, "raw": "②  수수료는 신청서 또는 신고서를 제출하면서 수입증지, 현금, 정보통신망을 이용한 전자화폐, 전자결제 등의\n방법으로 납부하여야 하며, 납부한 수수료의 반환에 대하여는 「대구광역시 북구 제증명 등 수수료 징수 조례」를\n따른다.(개정 2021.9.30)", "n_chars": 140, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A29-P03", "article": 29, "article_title": "수수료", "paragraph": "③", "label": "제29조(수수료) ③", "section": "본칙", "page_start": 11, "page_end": 12, "raw": "③  구청장은 제1항의 규정에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 심의위원회의 심의를\n거쳐 수수료의 전부 또는 일부를 감면할 수 있다.\n1.  광고물 등의 전수조사를 실시하고 그 결과에 따라 구제절차를 시행하는 경우\n2.  법령의 개정으로 이미 표시된 광고물 등이 새로 허가 또는 신고대상으로 분류된 경우(구청장이 일제조사 하\n여 허가 또는 신고를 신청하는 경우로 한정한다)\n3.  친환경 소재 현수막을 지정게시대 또는 가로등 현수기 등에 게시하는 경우<신설 2025.7.7.>", "n_chars": 278, "note": ""}, {"chunk_id": "DG-BG-1876-20260403-A30-P00", "article": 30, "article_title": "과태료의 부과기준", "paragraph": "", "label": "제30조(과태료의 부과기준)", "section": "본칙", "page_start": 12, "page_end": 12, "raw": "영 제55조에 따른 과태료의 세부 부과기준은 별표 6과 같다.", "n_chars": 34, "note": "별표·별지 원문 별도 확보 필요"}, {"chunk_id": "DG-BG-1876-20260403-SUP-01", "article": null, "article_title": "부칙", "paragraph": "", "label": "부칙 (전부개정 2017.12.29)", "section": "부칙", "page_start": 12, "pag
